[pytest]
# 让 pytest 从项目根目录启动，src.xxx 的 import 才能解析
# 同时把 src 也加入 path，使 src/agents、src/infra 等包既能以 agents.xxx / infra.xxx 引用，
# 也能以 src.agents.xxx / src.infra.xxx 引用（本项目两种写法并存）。
pythonpath = . src

# pytest-asyncio 模式：auto 表示所有 async 测试自动识别，无需手动加 @pytest.mark.asyncio
asyncio_mode = auto

# 关键：让所有测试共享同一个事件循环（默认 function = 每个测试一个循环并在测完关闭）
# 因为 supervisor_agent 用“模块级单例”持有 Redis 异步连接，若每个测试循环独立，
# 第一个测试结束后循环被关闭，后续测试复用单例就会报 “Event loop is closed”。
# 统一设为 session 作用域，循环在整个测试会话期间存活，单例的连接就不会失效。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# 测试文件发现目录
testpaths = test